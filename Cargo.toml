[package]
name = "rush-cli"
version = "0.3.2"
edition = "2024"

[[bin]]
name = "rush"
path = "src/main.rs"

[dependencies]
clap = {version = "4.6.7", features = ["derive"] }
rush-lib = {  git = "https://github.com/arcado-vol2/rush-lib.git", branch = "master"}
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10"
